# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: mynews
metadata:
  template: mynews@0.1.0

services:
  backend:
    project: ./backend
    language: py
    host: function

hooks:
  # Every provision (`azd provision`, `azd up`) first runs a what-if and lets
  # scripts/whatif_guard.py refuse changes that cost money or lose data:
  # deletes, the Cosmos free tier, regions, capabilities, backup, partition
  # key, vector policy and RU/s total, Foundry SKUs, always-ready instances
  # and the Flex plan. A blocked change you do want is accepted by naming its
  # rule, for that run only:
  #   WHATIF_ALLOW=<rule>[,<rule>] azd provision
  # Phase 0's one-way switch to continuous backup is the first such run:
  #   WHATIF_ALLOW=cosmos-backup azd provision
  # Needs `az login` as well as `azd auth login`; the what-if runs through az.
  preprovision:
    posix:
      shell: sh
      continueOnError: false
      interactive: false
      run: ./scripts/whatif.sh
  postprovision:
    posix:
      shell: sh
      continueOnError: false
      interactive: true
      run: ./scripts/postprovision.sh
