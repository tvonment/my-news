# XcodeGen spec for the Phase 1 identity spike. The .xcodeproj is generated and
# git-ignored: run `xcodegen generate` in this folder after changing this file.
name: AuthSpike

options:
  bundleIdPrefix: com.vonmentlen
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: 99J753GKC3
    CODE_SIGN_STYLE: Automatic
    # Swift 6 language mode with the isolation defaults the v2 app will use.
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  MSAL:
    url: https://github.com/AzureAD/microsoft-authentication-library-for-objc
    exactVersion: 2.16.0

targets:
  AuthSpike:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources
      # Written by ./configure.sh from the azd env and git-ignored: the repository is
      # public and keeps tenant and application ids out (docs/identity.md). Without it
      # the build stops at "Build input file cannot be found".
      - path: Generated/TenantIDs.swift
        optional: true
      - path: Resources/Info.plist
        buildPhase: none
    dependencies:
      - package: MSAL
    settings:
      base:
        # The redirect URI msauth.com.vonmentlen.mynews://auth is registered for
        # this bundle id, so the spike replaces the retired v1 app on the phone.
        PRODUCT_BUNDLE_IDENTIFIER: com.vonmentlen.mynews
        PRODUCT_NAME: AuthSpike
        MARKETING_VERSION: 0.2.0
        CURRENT_PROJECT_VERSION: 2
        TARGETED_DEVICE_FAMILY: "1"
        # Xcode merges Resources/Info.plist (URL scheme, query schemes) with the
        # keys it generates from the INFOPLIST_KEY_* settings below.
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Resources/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Auth Spike
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # No asset catalog on purpose: actool is what trips the
        # simulator-runtime trap described in the repo README.
    scheme: {}
